name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-artifacts:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Linux x86_64 Monolithic
          - target: linux-x86_64
            os: ubuntu-latest
            archive: polyglot-cli-linux-x86_64.tar.gz
            type: tar

          # 2. Linux ARM64 (aarch64) Monolithic
          - target: linux-aarch64
            os: ubuntu-24.04-arm
            archive: polyglot-cli-linux-aarch64.tar.gz
            type: tar

          # 3. macOS ARM64 (Apple Silicon)
          - target: macos-arm64
            os: macos-latest
            archive: polyglot-cli-macos-arm64.tar.gz
            type: tar

          # 4. macOS x86_64 (Intel Mac)
          - target: macos-x86_64
            os: macos-13
            archive: polyglot-cli-macos-x86_64.tar.gz
            type: tar

          # 5. Windows x86_64 Monolithic (MSYS2 UCRT64 Static)
          - target: windows-x86_64
            os: windows-latest
            archive: polyglot-cli-windows-x86_64.zip
            type: zip

    steps:
      - uses: actions/checkout@v4

      # --- Linux Toolchain Setup ---
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc g++ gfortran

      # --- macOS Toolchain Setup ---
      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ninja gcc

      # --- Windows Toolchain Setup (MSYS2 UCRT64) ---
      - name: Setup MSYS2 UCRT64
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cmake
            zip

      # --- Build on Linux / macOS ---
      - name: Build Monolithic Binary (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_FORTRAN=ON \
            -DPOLYGLOT_BUILD_STATIC=ON \
            -DBUILD_TESTING=OFF \
            -DBUILD_EXAMPLES=OFF
          cmake --build build --target cli_tool

      # --- Build on Windows (MSYS2 UCRT64) ---
      - name: Build Monolithic Binary (Windows MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_FORTRAN=ON \
            -DPOLYGLOT_BUILD_STATIC=ON \
            -DBUILD_TESTING=OFF \
            -DBUILD_EXAMPLES=OFF
          cmake --build build --target cli_tool

      # --- Package Artifacts ---
      - name: Package Release (tar.gz)
        if: matrix.type == 'tar'
        run: |
          mkdir -p dist
          cp build/polyglot-cli dist/
          cp LICENSE README.md dist/
          tar -czvf ${{ matrix.archive }} -C dist .

      - name: Package Release (zip)
        if: matrix.type == 'zip'
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp build/polyglot-cli.exe dist/
          cp LICENSE README.md dist/
          cd dist && zip -r ../${{ matrix.archive }} *

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
